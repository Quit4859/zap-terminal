[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zap-terminal-browser"
version = "3.0.0"
description = "ZAP terminal web browser"
requires-python = ">=3.10"
dependencies = [
  "textual>=0.70,<2",
  "playwright>=1.45",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "Pillow>=10.0.0",
]

[project.scripts]
zap = "main:run"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["zap*"]
